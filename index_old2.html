<style>
:root {
  --bg: #0f0f0f; --surface: #181818; --raised: #272727; --ink: #f1f1f1; --muted: #aaaaaa; --line: #303030;

  --font: "Roboto", "Arial", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 84px); }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-weight: 700; font-size: 20px; letter-spacing: -0.2px; margin: 0; }
h2.sec { font-size: 16px; font-weight: 500; color: var(--ink); margin: 0 0 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.date { color: var(--muted); font-size: 13px; }
.meters { display: flex; flex-direction: column; gap: 10px; }

.bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); transition: width .3s; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.meta b { color: var(--ink); font-weight: 500; }
.card { background: transparent; border: 0; border-radius: 0; overflow: visible; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 12px;
  background: linear-gradient(135deg, hsl(var(--h, 200) 28% 24%), hsl(calc(var(--h, 200) + 40) 28% 14%)); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb .glyph { font-weight: 700; font-size: 72px; line-height: 1; color: rgba(255,255,255,.14); }
.dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.info { padding: 12px 4px 0; display: flex; flex-direction: column; gap: 4px; }
.vtitle { font-weight: 500; font-size: 16px; line-height: 22px; margin: 0; overflow-wrap: anywhere; }
.chan { color: var(--muted); font-size: 14px; }
.why { font-size: 13px; color: var(--link); }
.actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
button, .btn { font: inherit; font-weight: 500; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 10px 16px; min-height: 44px; border: 0; background: var(--raised); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
button:hover, .btn:hover { background: #3f3f3f; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
button:active { opacity: .8; }
button:disabled { opacity: .4; cursor: default; }
button.skip { background: var(--raised); color: var(--ink); }
button.primary, .btn.primary { background: var(--ink); color: #0f0f0f; }
button.primary:hover { background: #d9d9d9; }

.note { color: var(--muted); font-size: 13px; }
.done { background: var(--surface); border-radius: 12px; padding: 24px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.done h2 { font-size: 18px; font-weight: 500; margin: 0; }
.done p { margin: 0; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; align-items: start; background: transparent; border: 0; border-radius: 0; padding: 0; }
.row .thumb { border-radius: 8px; aspect-ratio: 16 / 9; }
.row .thumb .glyph { font-size: 32px; }
.row .dur { font-size: 11px; right: 4px; bottom: 4px; padding: 0 4px; }
.row .t { font-weight: 500; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.row .c { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 12px; padding: 16px; text-align: center; }
.taste { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 0; background: var(--raised); color: var(--ink); }
.chip.up { color: var(--good); }
.chip.down { color: var(--warn); }
form.search { display: flex; gap: 8px; }
input[type=text], input[type=number], input[type=search] { font: inherit; width: 100%; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: #121212; color: var(--ink); }
input::placeholder { color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: #000; padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; user-select: all; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px 8px calc(env(safe-area-inset-bottom, 0px) + 4px); z-index: 5; }

nav button:hover { background: transparent; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { color: var(--ink); }
nav button[aria-current="page"] svg { stroke-width: 2.4; }
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 14px; overflow-y: auto; }
.sheet[hidden] { display: none; }
.player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); background: var(--ink); color: #0f0f0f; padding: 12px 16px; border-radius: 8px; z-index: 30; font-size: 14px; }
.toast[hidden] { display: none; }
#sugg { display: flex; flex-direction: column; gap: 18px; }
.avatar { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-weight: 500; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.chrow { display: flex; align-items: center; gap: 12px; }
.chrow .nm { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.chrow .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.when { display: block; color: var(--ink); font-size: 12px; font-weight: 500; margin-top: 2px; }
.info .when { font-size: 13px; }
.toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toast button { min-height: 0; padding: 6px 14px; background: #0f0f0f; color: #f1f1f1; flex: none; }
.toast button:hover { background: #272727; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.catchip { flex: none; min-height: 0; border-radius: 8px; padding: 7px 12px; background: var(--raised); font-size: 14px; }
.catchip.on { background: var(--ink); color: #0f0f0f; }
.catchip.on:hover { background: var(--ink); }
.catchip span { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
"use strict";
/* ---------- categories ---------- */
const GROUPS = [{ id: "ai", name: "AI news" }, { id: "news", name: "News" }, { id: "football", name: "Football" }];
const gname = id => (GROUPS.find(g => g.id === id) || {}).name || "";
const emptyShort = () => ({ ai: [], news: [], football: [] });
const defaultFilters = () => ({
  ai: { inc: "", exc: "" }, news: { inc: "", exc: "" },
  football: { inc: "samenvatting, hoogtepunten, highlights", exc: "motogp, formule 1, f1, grand prix, gp van, tennis, darts, wielren, golf" }
});
const PRESETS = [{ g: "news", q: "NOS op 3" }, { g: "news", q: "Nieuwsuur" }, { g: "news", q: "VPRO Tegenlicht" }, { g: "football", q: "Ziggo Sport" }, { g: "news", q: "LUBACH" }, { g: "news", q: "Big A" }, { g: "news", q: "AI Explained" }, { g: "news", q: "Prompt Engineering" }, { g: "news", q: "Fireship" }, { g: "news", q: "Caleb Writes Code" }, { g: "news", q: "AI Search" }];
/* ---------- storage ---------- */
const KEY = "five-a-day-app-v2";
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fresh = () => ({
  cfg: { clientId: "", maxVideos: 5, amMin: 15, pmMin: 45, hour: 12, days: 7, shortlist: 20 }, hist: {}, skipped: [], cat: "ai", filters: defaultFilters(), presetsDone: false,
  w: {}, token: null, tokenExp: 0, mode: "demo", channels: [], subs: [], subsAt: 0, chChanged: false,
  day: { date: todayStr(), kept: [], skipped: [], pool: [], poolAt: 0, short: emptyShort() }
});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); S = Object.assign(fresh(), p, { cfg: Object.assign(fresh().cfg, p.cfg || {}) }); } } catch (e) {}
function rollDay() { if (S.day.date !== todayStr()) S.day = { date: todayStr(), kept: [], skipped: [], pool: [], poolAt: 0, short: emptyShort() }; }
rollDay();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
(function migrate() {
  S.skipped = S.skipped || []; S.hist = S.hist || {}; const now = Date.now();
  if (!S.day.short || Array.isArray(S.day.short)) S.day.short = emptyShort(); GROUPS.forEach(g => { S.day.short[g.id] = S.day.short[g.id] || []; });
  const fill = (id, rec) => { const h = S.hist[id]; if (!h || h.st === "seen") S.hist[id] = rec; };
  Object.keys(S.seen || {}).forEach(id => fill(id, { t: "", c: "", ts: S.seen[id], st: "seen" })); delete S.seen;
  (S.day.skipped || []).forEach(id => fill(id, { t: "", c: "", ts: now, st: "seen" }));
  S.day.kept.forEach(v => fill(v.id, { t: v.title, c: v.channel, ts: now, st: "picked" }));
  S.skipped.forEach(v => fill(v.id, { t: v.title, c: v.channel, ts: v.sk || now, st: "skipped" }));
  const ks = Object.keys(S.hist); if (ks.length > 5000) ks.sort((a, b) => S.hist[a].ts - S.hist[b].ts).slice(0, ks.length - 5000).forEach(id => delete S.hist[id]);
  S.skipped = S.skipped.filter(v => now - (v.sk || now) < 30 * 864e5).slice(0, 60);
  S.channels.forEach(c => { if (!c.g) c.g = "ai"; });
  S.filters = S.filters || {}; GROUPS.forEach(g => { if (!S.filters[g.id]) S.filters[g.id] = defaultFilters()[g.id]; });
  if (!GROUPS.some(g => g.id === S.cat)) S.cat = "ai";
  if (!S.presetsDone) { PRESETS.forEach(pr => S.channels.push({ id: "pending:" + pr.g + ":" + pr.q, title: pr.q, thumb: "", g: pr.g, pending: true, q: pr.q })); S.presetsDone = true; }
})();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let tab = "today", busy = "", showSkipped = false, searchState = { q: "", groups: null, err: "", loading: false };

/* ---------- demo data ---------- */
const DEMO = [
  ["ai", "This week in AI: smaller models, bigger context", "Neural Weekly", 14, "Science & tech", 200],
  ["ai", "How the new reasoning models actually work", "Model Watch", 22, "Science & tech", 215],
  ["ai", "Running a 30B model on a laptop", "Prompt & Paper", 18, "Science & tech", 260],
  ["ai", "AI regulation in Europe, explained", "Neural Weekly", 12, "News", 200],
  ["ai", "Benchmarks are broken. Here is why.", "Model Watch", 17, "Science & tech", 215],
  ["ai", "Open weights vs closed models in 2026", "Prompt & Paper", 25, "Science & tech", 260],
  ["ai", "Agents in production: what failed", "Model Watch", 31, "Science & tech", 215],
  ["news", "Waarom de energieprijs weer stijgt", "Wereldwijd Uitgelegd", 8, "News", 35],
  ["news", "Verkiezingen in drie minuten", "Dagbericht", 6, "News", 20],
  ["news", "De woningmarkt: wie kan nog kopen?", "Achtergrond Live", 28, "News", 12],
  ["news", "Hoe werkt het stikstofbeleid?", "Wereldwijd Uitgelegd", 11, "News", 35],
  ["news", "Reportage: leven met hoogwater", "Achtergrond Live", 24, "News", 12],
  ["news", "Het journaal van vandaag", "Dagbericht", 15, "News", 20],
  ["news", "Waarom Nederland zo vol zit", "Wereldwijd Uitgelegd", 13, "News", 35],
  ["football", "Samenvatting | Ajax - Feyenoord", "Tribune Sport", 7, "Sports", 140],
  ["football", "Samenvatting | PSV - AZ", "Tribune Sport", 7, "Sports", 140],
  ["football", "Interview met de trainer na afloop", "Tribune Sport", 5, "Sports", 140],
  ["football", "Hoogtepunten | Twente - Utrecht", "Tribune Sport", 6, "Sports", 140],
  ["football", "SAMENVATTING GP van Japan", "Tribune Sport", 9, "Sports", 140],
  ["football", "Samenvatting | Heerenveen - Groningen", "Tribune Sport", 7, "Sports", 140],
  ["football", "Zo bereidt de selectie zich voor op de training", "Tribune Sport", 8, "Sports", 140],
  ["football", "Samenvatting | NEC - Sparta", "Tribune Sport", 7, "Sports", 140]
].map((v, i) => ({ id: "demo" + i, grp: v[0], title: v[1], channel: v[2], cat: v[4], secs: v[3] * 60, hue: v[5], demo: true, channelId: "demo:" + v[2], at: Date.now() - (((i * 5) % 9) * 24 + (i * 7) % 20 + 1) * 3600000 }));

/* ---------- time budget ---------- */
function allowanceMin() { const h = new Date().getHours() + new Date().getMinutes() / 60; return S.cfg.amMin + (h >= S.cfg.hour ? S.cfg.pmMin : 0); }
const usedSecs = () => S.day.kept.reduce((s, v) => s + v.secs, 0);
const remainingSecs = () => Math.max(0, allowanceMin() * 60 - usedSecs());
const countFull = () => S.cfg.maxVideos > 0 && S.day.kept.length >= S.cfg.maxVideos;
const fmt = secs => { const m = Math.round(secs / 60); return m < 1 ? "<1 min" : m + " min"; };
const clock = secs => { const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const hourLabel = h => (h % 12 === 0 ? 12 : h % 12) + ":00 " + (h >= 12 ? "pm" : "am");

/* ---------- the day's shortlist ---------- */
const shortMax = () => S.cfg.shortlist || 20;
const winDays = () => S.day.windowDays || S.cfg.days || 7;
const nextWin = () => [7, 14, 30].find(d => d > winDays());
const myChannels = () => S.channels.filter(c => c.id.startsWith("demo:") === (S.mode !== "live"));
const chansOf = g => myChannels().filter(c => c.g === g);
const chanSet = g => new Set(chansOf(g).filter(c => !c.pending).map(c => c.id));
const wordList = x => String(x || "").split(",").map(t => t.trim().toLowerCase()).filter(Boolean);
function groupOk(v, g) {
  const t = String(v.title).toLowerCase(), f = S.filters[g] || {}, inc = wordList(f.inc), exc = wordList(f.exc);
  if (inc.length && !inc.some(w => t.includes(w))) return false;
  return !exc.some(w => t.includes(w));
}
function eligible(g) {
  const set = chanSet(g);
  let pool;
  if (S.mode === "live") pool = S.day.pool.filter(v => set.has(v.channelId));
  else { pool = DEMO.filter(v => v.grp === g); if (set.size) pool = pool.filter(v => set.has(v.channelId)); }
  const oldest = Date.now() - winDays() * 864e5, dayMax = (S.cfg.amMin + S.cfg.pmMin) * 60;
  const wk = watchedKeys();
  return pool.filter(v => groupOk(v, g) && !S.hist[v.id] && !isWatched(v, wk) && !S.day.kept.some(k => k.id === v.id) && (!v.at || v.at >= oldest) && v.secs <= dayMax);
}
/* Newest day first. Inside a day, takes each channel's newest video first, then each channel's second newest. */
function mix(list, n) {
  const days = new Map();
  list.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).forEach(v => { const k = v.at ? new Date(v.at).toDateString() : "old"; if (!days.has(k)) days.set(k, []); days.get(k).push(v); });
  const out = [];
  for (const vids of days.values()) {
    if (out.length >= n) break;
    const by = new Map();
    vids.forEach(v => { const k = v.channelId || v.channel; if (!by.has(k)) by.set(k, []); by.get(k).push(v); });
    const cols = [...by.values()];
    for (let r = 0; out.length < n; r++) {
      let any = false;
      for (const c of cols) if (c[r]) { out.push(c[r]); any = true; if (out.length >= n) break; }
      if (!any) break;
    }
  }
  return out;
}
const WATCHED = new Set(["picked", "played"]);
function watchedKeys() { const k = new Set(); Object.values(S.hist).forEach(h => { if (WATCHED.has(h.st) && h.t) k.add(norm(h.c) + "|" + norm(h.t)); }); return k; }
function isWatched(v, wk) { const h = S.hist[v.id]; return !!(h && WATCHED.has(h.st)) || (wk || watchedKeys()).has(norm(v.channel) + "|" + norm(v.title)); }
function trimShort() {
  GROUPS.forEach(g => {
    const list = S.day.short[g.id], done = list.filter(v => S.hist[v.id]), open = list.filter(v => !S.hist[v.id]);
    S.day.short[g.id] = done.concat(open.slice(0, Math.max(0, shortMax() - done.length)));
  });
}
const record = (v, st) => { S.hist[v.id] = { t: v.title, c: v.channel, ts: Date.now(), st }; };
function markPlayed(id) { const h = S.hist[id]; if (h && h.st === "picked") { h.st = "played"; h.ts = Date.now(); save(); } }
function exportHist() {
  const q = x => '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"';
  const rows = Object.entries(S.hist).sort((a, b) => b[1].ts - a[1].ts).map(([id, h]) => [new Date(h.ts).toISOString().slice(0, 10), h.st, h.t, h.c, "https://www.youtube.com/watch?v=" + id].map(q).join(","));
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["date,status,title,channel,link\n" + rows.join("\n")], { type: "text/csv" })); a.download = "five-a-day-history.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function buildShort(g) {
  const list = S.day.short[g], need = shortMax() - list.length; if (need <= 0) return;
  const have = new Set(list.map(v => v.id));
  const add = mix(eligible(g).filter(v => !have.has(v.id)), need);
  if (add.length) { add.forEach(v => list.push(Object.assign({}, v, { grp: g }))); save(); }
}
function candidates(g) {

  return '<li class="row">' + thumbHtml(v) + '<div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + (v.grp ? esc(gname(v.grp)) + " · " : "") + esc(v.channel) + " · " + fmt(v.secs) + '</div>' + whenHtml(v) + '<div class="btns"><button class="small primary" data-act="unskip" data-id="' + esc(v.id) + '" type="button">Bring back</button></div></div></li>';
}
function thumbHtml(v) {
  return '<div class="thumb" style="--h:' + (v.hue || (v.channel.length * 37) % 360) + '"><span class="glyph">' + esc(v.channel[0]) + '</span>' +
    (v.demo ? "" : '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">') +
    '<span class="dur">' + clock(v.secs) + '</span></div>';
}
function meters() {
  const allow = allowanceMin() * 60, used = usedSecs(), pct = Math.min(100, allow ? used / allow * 100 : 0);
  const am = new Date().getHours() < S.cfg.hour;
  const slots = S.cfg.maxVideos > 0 ? '<div class="slots">' + Array.from({ length: S.cfg.maxVideos }, (_, i) => '<div class="slot' + (i < S.day.kept.length ? " on" : "") + '"></div>').join("") + "</div>" : "";
  return '<div class="meters">' + slots + '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="meta"><span><b>' + fmt(used) + "</b> of " + fmt(allow) + ' used</span><span>' +
    (am && S.cfg.pmMin ? "+" + S.cfg.pmMin + " min at " + hourLabel(S.cfg.hour) : S.day.kept.length + (S.cfg.maxVideos ? " of " + S.cfg.maxVideos : "") + " chosen") + "</span></div></div>";
}
function renderToday() {
  const d = new Date();
  if (!busy && (S.mode !== "live" || S.day.poolAt)) GROUPS.forEach(g => { if (S.day.short[g.id].length < shortMax()) buildShort(g.id); });
  const live = S.mode === "live";
  let h = '<div class="top"><h1>Five a Day</h1><span class="date">' + d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) + "</span></div>" + meters() + catChips(g => candidates(g).filter(v => v.secs <= remainingSecs()).length);
  if (!live) h += '<div class="panel"><strong>You are looking at demo videos.</strong><span class="note">Connect your YouTube account to see new uploads from the channels you choose.</span><button class="primary" data-act="goto-settings" type="button">Set up YouTube</button></div>';
  if (busy) h += '<div class="card done"><p>' + esc(busy) + "</p></div>";
  else {
    const cand = candidates(), fit = cand.filter(v => v.secs <= remainingSecs()), v = fit[0];
    const hidden = cand.length - fit.length;
    if (live && !chansOf(S.cat).length) h += '<div class="card done"><h2>Add channels to ' + esc(gname(S.cat)) + '</h2><p>Pick the channels you want to hear from in this category.</p><button class="primary" data-act="goto-channels" type="button">Add channels</button></div>';
    else if (live && !S.day.poolAt) h += '<div class="card done"><h2>Ready when you are</h2><p>Load today\'s candidates from your channels.</p><button class="primary" data-act="load" type="button">Load videos</button></div>';
    else if (countFull()) h += '<div class="card done"><h2>That\'s your ' + S.cfg.maxVideos + ".</h2><p>YouTube can wait until tomorrow. Enjoy these.</p></div>";
    else if (remainingSecs() < 60) {
      const am = new Date().getHours() < S.cfg.hour;
      h += '<div class="card done"><h2>Time\'s used up for now.</h2><p>' + (am && S.cfg.pmMin ? S.cfg.pmMin + " more minutes unlock at " + hourLabel(S.cfg.hour) + "." : "See you tomorrow.") + "</p></div>";
    } else if (!v) h += '<div class="card done"><h2>' + (hidden ? "Nothing that fits." : "That\'s the whole list.") + '</h2><p>' + (hidden ? hidden + " videos are longer than your time left." : "You\'ve been through today\'s " + S.day.short[S.cat].length + ".") + '</p>' + (live ? '<button data-act="load" type="button">Refresh list</button>' : "") + "</div>";
    else {
      h += '<article class="card">' + thumbHtml(v) + '<div class="info"><h2 class="vtitle">' + esc(v.title) + '</h2><div class="chan">' + esc(v.channel) + (v.cat ? " · " + esc(v.cat) : "") + '</div>' + whenHtml(v) + '</div></article>' +
        '<div class="actions"><button class="skip" data-act="skip" data-id="' + esc(v.id) + '" type="button">Not for me</button><button class="primary" data-act="keep" data-id="' + esc(v.id) + '" type="button">Watch today</button></div>';
      if (hidden) h += '<p class="note">' + hidden + " longer video" + (hidden > 1 ? "s are" : " is") + " hidden until you have more time.</p>";
    }
  }
  if (!busy && (!live || S.day.poolAt)) h += windowNote();
  h += '<section><h2 class="sec">Today\'s picks</h2><ul class="list">' + (S.day.kept.length ? S.day.kept.map(rowHtml).join("") : '<li class="empty">Nothing chosen yet.</li>') + "</ul></section>";
  if (S.skipped.length) h += '<section><button class="small" data-act="toggleskipped" type="button">' + (showSkipped ? "Hide skipped" : "Skipped videos (" + S.skipped.length + ")") + "</button>" + (showSkipped ? '<ul class="list" style="margin-top:12px">' + S.skipped.slice(0, 20).map(skippedRow).join("") + "</ul>" : "") + "</section>";
  if (live && S.day.poolAt && !busy) {
    if (GROUPS.some(g => S.day.short[g.id].length < shortMax())) h += (S.chChanged ? '<p class="note">Your channel list changed. Refresh to include new uploads.</p>' : "") + '<button class="small' + (S.chChanged ? " primary" : "") + '" data-act="load" type="button" style="align-self:flex-start">Refresh candidates</button>';
    else if (S.chChanged) h += '<p class="note">Today\'s list of ' + shortMax() + ' is set. New channels start showing up tomorrow.</p>';
  }
  $("view").innerHTML = h;
}
function rowHtml(v) {
  return '<li class="row">' + thumbHtml(v) + '<div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + (v.grp ? esc(gname(v.grp)) + " · " : "") + esc(v.channel) + " · " + fmt(v.secs) + '</div>' + whenHtml(v) + '<div class="btns"><button class="small primary" data-act="play" data-id="' + esc(v.id) + '" type="button">Play</button><button class="small" data-act="unkeep" data-id="' + esc(v.id) + '" type="button">Remove</button></div></div></li>';
}
function renderSearch() {
  $("view").innerHTML = '<div class="top"><h1>Search</h1></div>' +
    (S.mode === "live" ? '<form class="search" id="sform"><input type="search" id="sq" placeholder="Find a specific video" autocomplete="off" value="' + esc(searchState.q) + '"><button class="primary" type="submit">Go</button></form><div id="sres"></div>'
      : '<div class="panel"><strong>Search needs a YouTube connection.</strong><span class="note">Connect your account in Settings to search real videos.</span><button class="primary" data-act="goto-settings" type="button">Set up YouTube</button></div>');
  if (S.mode === "live") renderSearchResults();
}
function searchRow(v) {
  const added = S.day.kept.some(k => k.id === v.id), ok = fits(v);
  return '<li class="row">' + thumbHtml(v) + '<div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + esc(v.channel) + " · " + fmt(v.secs) + '</div>' + whenHtml(v) + '<div class="btns">' +
    (added ? '<button class="small" disabled type="button">Added</button>' : '<button class="small primary" data-act="keep" data-id="' + esc(v.id) + '" type="button"' + (ok ? "" : " disabled") + ">Add to today</button>") +
    '<button class="small" data-act="play" data-id="' + esc(v.id) + '" type="button">Preview</button></div>' + (!ok && !added ? '<div class="c" style="margin-top:6px">Too long for the time left.</div>' : "") + "</div></li>";
}
function renderSearchResults() {
  const el = $("sres"); if (!el) return;
  const st = searchState;
  if (!st.groups) { el.innerHTML = '<p class="note">Results cover the last 7 days. Use "Search earlier" to look further back. Anything you add counts toward today\'s time and video limit.</p>'; return; }
  let h = '<div style="display:flex;flex-direction:column;gap:18px">';
  st.groups.forEach(g => { h += '<section><h2 class="sec">' + SLABEL[g.idx] + "</h2>" + (g.vids.length ? '<ul class="list">' + g.vids.map(searchRow).join("") + "</ul>" : '<div class="empty">No videos found for this period.</div>') + "</section>"; });
  if (st.err) h += '<div class="empty">' + esc(st.err) + "</div>";
  if (st.loading) h += '<p class="note">Searching…</p>';
  else if (st.groups.length <= 3) h += '<button data-act="searchmore" type="button">Search earlier (' + SNEXT[st.groups.length] + ")</button>";
  el.innerHTML = h + "</div>";
}
function renderSettings() {
  const c = S.cfg, live = S.mode === "live";
  $("view").innerHTML = '<div class="top"><h1>Settings</h1></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">YouTube connection</h2>' +
    '<p class="note" style="margin:0">' + (live ? "Connected. The channels you choose feed the daily list." : "Not connected. Demo videos are shown.") + "</p>" +
    '<label class="f">Google client ID<input type="text" id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="123456-abc.apps.googleusercontent.com" value="' + esc(c.clientId) + '"></label>' +
    '<p class="note" style="margin:0">In Google Cloud Console, add this address as an authorized JavaScript origin:</p><code>' + esc(location.origin) + "</code>" +
    '<div class="actions" style="grid-template-columns:1fr 1fr"><button class="primary" data-act="connect" type="button">' + (live ? "Reconnect" : "Connect YouTube") + '</button><button data-act="disconnect" type="button">' + (live ? "Disconnect" : "Use demo") + "</button></div></div>" +
    '<div class="panel"><h2 class="sec" style="margin:0">Daily limits</h2><div class="grid2">' +
    '<label class="f">Videos per day (0 = no cap)<input type="number" inputmode="numeric" id="mv" min="0" max="20" value="' + c.maxVideos + '"></label>' +
    '<label class="f">Switch hour (0–23)<input type="number" inputmode="numeric" id="hr" min="0" max="23" value="' + c.hour + '"></label>' +
    '<label class="f">Minutes before the switch<input type="number" inputmode="numeric" id="am" min="0" max="600" value="' + c.amMin + '"></label>' +
    '<label class="f">Extra minutes after<input type="number" inputmode="numeric" id="pm" min="0" max="600" value="' + c.pmMin + '"></label>' +
    '<label class="f" style="grid-column:1/-1">Show uploads from the last (days)<input type="number" inputmode="numeric" id="dy" min="1" max="30" value="' + c.days + '"></label>' +
    '<label class="f" style="grid-column:1/-1">Videos per category in my daily list<input type="number" inputmode="numeric" id="sl" min="1" max="100" value="' + c.shortlist + '"></label></div>' +
    '<button class="primary" data-act="savecfg" type="button">Save limits</button></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">History</h2><p class="note" style="margin:0">' + Object.keys(S.hist).length + ' videos saved on this device, with title and channel. Videos you picked or played never come back.</p><button data-act="exporthist" type="button">Download history (CSV)</button></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">Today</h2><button data-act="resetday" type="button">Start today over</button></div>' +
    '<p class="note">Each day you get a shortlist of up to ' + shortMax() + ' videos per category, newest first, spread across the channels in it. Skipped videos stay out until you bring them back.</p>';
}
function render() { rollDay(); ({ today: renderToday, search: renderSearch, settings: renderSettings, channels: renderChannels })[tab](); document.querySelectorAll("#nav button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); }
function setTab(t) { tab = t; render(); window.scrollTo(0, 0); if (t === "channels") { ensureSubs(); if (S.mode === "live" && tokenValid() && S.channels.some(c => c.pending && !c.failed)) resolvePending(); } }

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const nb = e.target.closest("#nav button"); if (nb) return setTab(nb.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "keep") { const v = findVideo(id); if (v) keep(v); if (tab === "search") renderSearchResults(); }
  else if (act === "skip") { const v = findVideo(id); if (v) skip(v); }
  else if (act === "unkeep") unkeep(id);
  else if (act === "play") { markPlayed(id); openPlayer(id); }
  else if (act === "close") closePlayer();
  else if (act === "like") { try { await api("videos/rate", { id, rating: "like" }, { method: "POST" }); toast("Liked on YouTube."); } catch (er) { toast(er.message); } }
  else if (act === "load") loadPool();
  else if (act === "goto-settings") setTab("settings");
  else if (act === "goto-channels") setTab("channels");
  else if (act === "older") { S.day.windowDays = nextWin(); save(); if (S.mode === "live") loadPool(); else render(); }
  else if (act === "unskip") unskip(id);
  else if (act === "exporthist") exportHist();
  else if (act === "toggleskipped") { showSkipped = !showSkipped; render(); }
  else if (act === "searchmore") searchGroup(searchState.q, searchState.groups.length);
  else if (act === "toastact") { const f = toastFn; toastFn = null; $("toast").hidden = true; if (f) f(); }
  else if (act === "cat") { S.cat = id; chQuery = ""; remote = { q: "", res: null, err: "" }; showSubs = false; save(); render(); }
  else if (act === "addch") addChannel(id);
  else if (act === "rmch") removeChannel(id);
  else if (act === "browse") { showSubs = !showSubs; b.textContent = showSubs ? "Hide my subscriptions" : "Browse my YouTube subscriptions"; updateSugg(); }
  else if (act === "reauth") { try { await signIn(false); await ensureSubs(); const q = chQuery.trim(); if (q.length >= 3) remoteSearch(q); else updateSugg(); } catch (er) { toast(er.message); } }
  else if (act === "connect") {
    S.cfg.clientId = $("cid").value.trim(); save();
    try { await signIn(true); toast("Connected."); setTab("today"); loadPool(); } catch (er) { toast(er.message); }
  } else if (act === "disconnect") { S.mode = "demo"; S.token = null; S.tokenExp = 0; save(); render(); }
  else if (act === "savecfg") {
    const n = (id, lo, hi, d) => { const x = parseInt($(id).value, 10); return isNaN(x) ? d : Math.min(hi, Math.max(lo, x)); };
    S.cfg.clientId = $("cid").value.trim(); S.cfg.maxVideos = n("mv", 0, 20, 5); S.cfg.hour = n("hr", 0, 23, 12); S.cfg.amMin = n("am", 0, 600, 15); S.cfg.pmMin = n("pm", 0, 600, 45); S.cfg.days = n("dy", 1, 30, 7); S.day.windowDays = 0; S.cfg.shortlist = n("sl", 1, 100, 20); trimShort();
    save(); toast("Saved."); render();
  } else if (act === "resetday") { S.day.kept.forEach(v => { delete S.hist[v.id]; }); S.day.kept = []; save(); toast("Today reset."); render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "finc" || e.target.id === "fexc") {
    const f = S.filters[S.cat] = S.filters[S.cat] || { inc: "", exc: "" };
    f[e.target.id === "finc" ? "inc" : "exc"] = e.target.value;
    S.day.short[S.cat] = S.day.short[S.cat].filter(v => S.hist[v.id] || groupOk(v, S.cat));
    buildShort(S.cat); save(); return;
  }
  if (e.target.id !== "cq") return;
  chQuery = e.target.value; clearTimeout(remoteTimer); updateSugg();
  const q = chQuery.trim();
  if (S.mode === "live" && q.length >= 3 && tokenValid()) remoteTimer = setTimeout(() => remoteSearch(q), 700);
});
document.addEventListener("submit", e => { if (e.target.id === "sform") { e.preventDefault(); const q = $("sq").value.trim(); if (q) runSearch(q); } });

/* ---------- home-screen icon, drawn at runtime ---------- */
try {
  const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
  x.fillStyle = "#0f0f0f"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#ffffff"; x.font = "700 118px 'Helvetica Neue', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText("5", 90, 128);
  x.fillStyle = "#ff0000"; for (let i = 0; i < 5; i++) x.fillRect(30 + i * 24, 148, 18, 6);
  $("touchIcon").href = c.toDataURL("image/png");
} catch (e) {}

render();
setInterval(() => { if (tab === "today" && !busy && $("sheet").hidden) render(); }, 60000);
if (S.mode === "live" && !S.day.poolAt && tokenValid() && myChannels().length) loadPool();
</script>
