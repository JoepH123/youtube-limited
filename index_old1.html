<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Five a Day">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f0f0f">
<title>Five a Day</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0f0f0f; --surface: #181818; --raised: #272727; --ink: #f1f1f1; --muted: #aaaaaa; --line: #303030;
  --red: #ff0000; --link: #3ea6ff; --warn: #ff7a7a; --good: #3ea6ff;
  --font: "Roboto", "Arial", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 84px); }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-weight: 700; font-size: 20px; letter-spacing: -0.2px; margin: 0; }
h2.sec { font-size: 16px; font-weight: 500; color: var(--ink); margin: 0 0 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.date { color: var(--muted); font-size: 13px; }
.meters { display: flex; flex-direction: column; gap: 10px; }
.slots { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.slot { height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); }
.slot.on { background: var(--red); }
.bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); transition: width .3s; }
.meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.meta b { color: var(--ink); font-weight: 500; }
.card { background: transparent; border: 0; border-radius: 0; overflow: visible; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 12px;
  background: linear-gradient(135deg, hsl(var(--h, 200) 28% 24%), hsl(calc(var(--h, 200) + 40) 28% 14%)); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb .glyph { font-weight: 700; font-size: 72px; line-height: 1; color: rgba(255,255,255,.14); }
.dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.info { padding: 12px 4px 0; display: flex; flex-direction: column; gap: 4px; }
.vtitle { font-weight: 500; font-size: 16px; line-height: 22px; margin: 0; overflow-wrap: anywhere; }
.chan { color: var(--muted); font-size: 14px; }
.why { font-size: 13px; color: var(--link); }
.actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
button, .btn { font: inherit; font-weight: 500; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 10px 16px; min-height: 44px; border: 0; background: var(--raised); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
button:hover, .btn:hover { background: #3f3f3f; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
button:active { opacity: .8; }
button:disabled { opacity: .4; cursor: default; }
button.skip { background: var(--raised); color: var(--ink); }
button.primary, .btn.primary { background: var(--ink); color: #0f0f0f; }
button.primary:hover { background: #d9d9d9; }
button.small, .btn.small { min-height: 0; padding: 7px 14px; font-size: 13px; }
.note { color: var(--muted); font-size: 13px; }
.done { background: var(--surface); border-radius: 12px; padding: 24px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.done h2 { font-size: 18px; font-weight: 500; margin: 0; }
.done p { margin: 0; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; align-items: start; background: transparent; border: 0; border-radius: 0; padding: 0; }
.row .thumb { border-radius: 8px; aspect-ratio: 16 / 9; }
.row .thumb .glyph { font-size: 32px; }
.row .dur { font-size: 11px; right: 4px; bottom: 4px; padding: 0 4px; }
.row .t { font-weight: 500; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.row .c { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 12px; padding: 16px; text-align: center; }
.taste { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 0; background: var(--raised); color: var(--ink); }
.chip.up { color: var(--good); }
.chip.down { color: var(--warn); }
form.search { display: flex; gap: 8px; }
input[type=text], input[type=number], input[type=search] { font: inherit; width: 100%; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: #121212; color: var(--ink); }
input::placeholder { color: var(--muted); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: #000; padding: 4px 8px; border-radius: 6px; overflow-wrap: anywhere; user-select: all; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px 8px calc(env(safe-area-inset-bottom, 0px) + 4px); z-index: 5; }
nav button { background: transparent; color: var(--muted); min-height: 48px; font-size: 10px; border-radius: 8px; flex-direction: column; gap: 3px; padding: 6px 4px; }
nav button:hover { background: transparent; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { color: var(--ink); }
nav button[aria-current="page"] svg { stroke-width: 2.4; }
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 14px; overflow-y: auto; }
.sheet[hidden] { display: none; }
.player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); background: var(--ink); color: #0f0f0f; padding: 12px 16px; border-radius: 8px; z-index: 30; font-size: 14px; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="view"></div>
<nav id="nav">
  <button data-tab="today" type="button"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Today</span></button>
  <button data-tab="search" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></button>
  <button data-tab="settings" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "five-a-day-app-v2";
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fresh = () => ({
  cfg: { clientId: "", maxVideos: 5, amMin: 15, pmMin: 45, hour: 12 },
  w: {}, token: null, tokenExp: 0, mode: "demo",
  day: { date: todayStr(), kept: [], skipped: [], pool: [], poolAt: 0 }
});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); S = Object.assign(fresh(), p, { cfg: Object.assign(fresh().cfg, p.cfg || {}) }); } } catch (e) {}
function rollDay() { if (S.day.date !== todayStr()) S.day = { date: todayStr(), kept: [], skipped: [], pool: [], poolAt: 0 }; }
rollDay();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let tab = "today", busy = "", searchState = { q: "", res: null, err: "" };

/* ---------- demo data ---------- */
const DEMO = [
  ["Why bridges hum in the wind", "Span Lab", 14, "Science", 200], ["I rebuilt a 1960s radio from one photo", "Bench Notes", 23, "Making", 20],
  ["The quiet collapse of the Bronze Age", "Long Ago", 41, "History", 35], ["A week of cooking only from one pot", "Salt & Steam", 18, "Cooking", 12],
  ["How a mechanical watch keeps time", "Escapement", 16, "Science", 215], ["Learning Rust by building a tiny database", "Null Pointer", 52, "Coding", 260],
  ["Cutting dovetails by hand, slowly", "Oak & Chisel", 27, "Making", 30], ["Why every city map lies a little", "Flat Earth Cartography", 12, "Geography", 170],
  ["Piano voicings that sound expensive", "Chord Garden", 21, "Music", 300], ["Eight stretches for desk shoulders", "Move Daily", 9, "Fitness", 140],
  ["What index funds actually own", "Plain Ledger", 11, "Finance", 100], ["Fixing a leaking faucet in ten minutes", "Fix It Ben", 10, "Making", 80],
  ["How sourdough starters stay alive", "Salt & Steam", 15, "Cooking", 12], ["Python tricks I wish I knew sooner", "Null Pointer", 13, "Coding", 260],
  ["Interest rates, explained with a bathtub", "Plain Ledger", 16, "Finance", 100], ["Three days in Lisbon on a budget", "Slow Roads", 25, "Travel", 55]
].map((v, i) => ({ id: "demo" + i, title: v[0], channel: v[1], cat: v[3], secs: v[2] * 60, hue: v[4], demo: true }));

/* ---------- time budget ---------- */
function allowanceMin() { const h = new Date().getHours() + new Date().getMinutes() / 60; return S.cfg.amMin + (h >= S.cfg.hour ? S.cfg.pmMin : 0); }
const usedSecs = () => S.day.kept.reduce((s, v) => s + v.secs, 0);
const remainingSecs = () => Math.max(0, allowanceMin() * 60 - usedSecs());
const countFull = () => S.cfg.maxVideos > 0 && S.day.kept.length >= S.cfg.maxVideos;
const fmt = secs => { const m = Math.round(secs / 60); return m < 1 ? "<1 min" : m + " min"; };
const clock = secs => { const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const hourLabel = h => (h % 12 === 0 ? 12 : h % 12) + ":00 " + (h >= 12 ? "pm" : "am");

/* ---------- taste model ---------- */
const STOP = new Set("about after again being could every first from have into just more most only other over really should some still than that their them then there these they this those very what when where which while with would your video videos make made".split(" "));
function keysOf(v) {
  const words = (String(v.title).toLowerCase().match(/[a-z]{5,}/g) || []).filter(w => !STOP.has(w)).slice(0, 4);
  return [["ch:" + v.channel, 1.5], v.cat ? ["cat:" + v.cat, 1] : null, ...words.map(w => ["w:" + w, 0.5])].filter(Boolean);
}
const score = v => keysOf(v).reduce((s, [k, m]) => s + (S.w[k] || 0) * m, 0);
const bump = (v, d) => keysOf(v).forEach(([k]) => { S.w[k] = Math.round(((S.w[k] || 0) + d) * 10) / 10; });
function candidates() {
  const pool = S.mode === "live" ? S.day.pool : DEMO;
  const gone = new Set([...S.day.kept.map(v => v.id), ...S.day.skipped]);
  return pool.filter(v => !gone.has(v.id)).sort((a, b) => score(b) - score(a));
}
function why(v) {
  if ((S.w["ch:" + v.channel] || 0) > 0) return "You've picked " + v.channel + " before.";
  if (v.cat && (S.w["cat:" + v.cat] || 0) > 0) return "You keep choosing " + v.cat.toLowerCase() + ".";
  return "New from channels you follow.";
}

/* ---------- YouTube API ---------- */
let tokenClient = null, tokenWait = null;
function tokenValid() { return S.token && Date.now() < S.tokenExp - 30000; }
function signIn(interactive) {
  return new Promise((resolve, reject) => {
    if (!S.cfg.clientId) return reject(new Error("Add your Google client ID in Settings first."));
    if (!(window.google && google.accounts && google.accounts.oauth2)) return reject(new Error("Google sign-in is still loading. Try again in a moment."));
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.cfg.clientId, scope: "https://www.googleapis.com/auth/youtube",
      callback: r => {
        if (r.error) return reject(new Error("Sign-in failed: " + (r.error_description || r.error)));
        S.token = r.access_token; S.tokenExp = Date.now() + (r.expires_in || 3600) * 1000; S.mode = "live"; save(); resolve();
      },
      error_callback: e => reject(new Error("Sign-in was closed or blocked (" + (e.type || "unknown") + ")."))
    });
    tokenClient.requestAccessToken({ prompt: interactive ? "select_account" : "" });
  });
}
async function api(path, params, opts) {
  opts = opts || {};
  if (!tokenValid()) await signIn(false);
  const url = "https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams(params).toString();
  const r = await fetch(url, { method: opts.method || "GET", headers: { Authorization: "Bearer " + S.token } });
  if (r.status === 204) return {};
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && j.error.message) || ("YouTube error " + r.status)); e.status = r.status; e.reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason; throw e; }
  return j;
}
function isoSecs(d) { const m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(d || ""); if (!m) return 0; return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0); }
async function hydrate(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const j = await api("videos", { part: "snippet,contentDetails", id: ids.slice(i, i + 50).join(","), maxResults: 50 });
    (j.items || []).forEach(it => out.push({
      id: it.id, title: it.snippet.title, channel: it.snippet.channelTitle, cat: CATS[it.snippet.categoryId] || "",
      secs: isoSecs(it.contentDetails.duration), live: it.snippet.liveBroadcastContent !== "none"
    }));
  }
  return out;
}
const CATS = { 1: "Film", 2: "Autos", 10: "Music", 15: "Pets", 17: "Sports", 19: "Travel", 20: "Gaming", 22: "People", 23: "Comedy", 24: "Entertainment", 25: "News", 26: "How-to", 27: "Education", 28: "Science & tech", 29: "Nonprofit" };
async function loadPool() {
  busy = "Reading your subscriptions…"; render();
  try {
    const subs = [];
    let page = "";
    for (let n = 0; n < 2; n++) {
      const j = await api("subscriptions", Object.assign({ part: "snippet", mine: "true", maxResults: 50, order: "relevance" }, page ? { pageToken: page } : {}));
      (j.items || []).forEach(s => subs.push(s.snippet.resourceId.channelId));
      page = j.nextPageToken; if (!page) break;
    }
    const picked = subs.slice(0, 60);
    const ids = new Set(), cutoff = Date.now() - 21 * 86400000;
    for (let i = 0; i < picked.length; i += 10) {
      busy = "Finding new uploads (" + Math.min(i + 10, picked.length) + "/" + picked.length + ")…"; render();
      await Promise.all(picked.slice(i, i + 10).map(async ch => {
        try {
          const j = await api("playlistItems", { part: "contentDetails", playlistId: "UU" + ch.slice(2), maxResults: 3 });
          (j.items || []).forEach(it => { if (new Date(it.contentDetails.videoPublishedAt || 0).getTime() > cutoff) ids.add(it.contentDetails.videoId); });
        } catch (e) { if (e.status === 401 || e.reason === "quotaExceeded") throw e; }
      }));
    }
    const vids = (await hydrate([...ids])).filter(v => !v.live && v.secs > 60);
    S.day.pool = vids; S.day.poolAt = Date.now(); busy = ""; save(); render();
    if (!vids.length) toast("No new uploads found from your subscriptions.");
  } catch (e) { busy = ""; render(); toast(e.message); }
}
async function runSearch(q) {
  searchState = { q, res: null, err: "" }; renderSearchResults("Searching…");
  try {
    const j = await api("search", { part: "snippet", q, type: "video", maxResults: 12, safeSearch: "none" });
    const ids = (j.items || []).map(i => i.id.videoId).filter(Boolean);
    searchState.res = ids.length ? (await hydrate(ids)).filter(v => !v.live) : [];
  } catch (e) { searchState.err = e.message; }
  renderSearchResults();
}

/* ---------- actions ---------- */
function fits(v) { return !countFull() && v.secs <= remainingSecs(); }
function keep(v) {
  if (!fits(v)) return toast(countFull() ? "You've reached today's video limit." : "That one is longer than your time left.");
  if (S.day.kept.some(k => k.id === v.id)) return;
  S.day.kept.push(v); S.day.skipped = S.day.skipped.filter(x => x !== v.id); bump(v, 1); save(); render();
}
function skip(v) { S.day.skipped.push(v.id); bump(v, -1); save(); render(); }
function unkeep(id) { const v = S.day.kept.find(k => k.id === id); if (!v) return; S.day.kept = S.day.kept.filter(k => k.id !== id); bump(v, -1); save(); render(); }
const findVideo = id => S.day.kept.find(v => v.id === id) || (S.day.pool || []).find(v => v.id === id) || (searchState.res || []).find(v => v.id === id) || DEMO.find(v => v.id === id);
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }

/* ---------- player sheet ---------- */
function openPlayer(id) {
  const v = findVideo(id); if (!v) return;
  const watch = "https://www.youtube.com/watch?v=" + encodeURIComponent(v.id);
  $("sheet").innerHTML = '<div class="top"><h2 class="sec" style="margin:0">Now playing</h2><button class="small" data-act="close" type="button">Close</button></div>' +
    (v.demo ? '<div class="thumb" style="--h:' + v.hue + '"><span class="glyph">' + esc(v.channel[0]) + '</span></div><p class="note">Demo video. Connect YouTube in Settings to play real videos here.</p>'
      : '<div class="player"><iframe src="https://www.youtube.com/embed/' + encodeURIComponent(v.id) + '?playsinline=1&rel=0&autoplay=1" title="' + esc(v.title) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>') +
    '<div><h2 class="vtitle">' + esc(v.title) + '</h2><div class="chan">' + esc(v.channel) + " · " + fmt(v.secs) + '</div></div>' +
    '<div class="actions" style="grid-template-columns:1fr 1fr">' +
    (v.demo ? "" : '<button data-act="like" data-id="' + esc(v.id) + '" type="button">Like on YouTube</button>') +
    '<a class="btn" href="' + watch + '" target="_blank" rel="noopener">Open on YouTube</a></div>' +
    '<p class="note">Seeing ads? Open on YouTube. Premium always applies there.</p>';
  $("sheet").hidden = false;
}
function closePlayer() { $("sheet").innerHTML = ""; $("sheet").hidden = true; }

/* ---------- views ---------- */
function thumbHtml(v) {
  return '<div class="thumb" style="--h:' + (v.hue || (v.channel.length * 37) % 360) + '"><span class="glyph">' + esc(v.channel[0]) + '</span>' +
    (v.demo ? "" : '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">') +
    '<span class="dur">' + clock(v.secs) + '</span></div>';
}
function meters() {
  const allow = allowanceMin() * 60, used = usedSecs(), pct = Math.min(100, allow ? used / allow * 100 : 0);
  const am = new Date().getHours() < S.cfg.hour;
  const slots = S.cfg.maxVideos > 0 ? '<div class="slots">' + Array.from({ length: S.cfg.maxVideos }, (_, i) => '<div class="slot' + (i < S.day.kept.length ? " on" : "") + '"></div>').join("") + "</div>" : "";
  return '<div class="meters">' + slots + '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="meta"><span><b>' + fmt(used) + "</b> of " + fmt(allow) + ' used</span><span>' +
    (am && S.cfg.pmMin ? "+" + S.cfg.pmMin + " min at " + hourLabel(S.cfg.hour) : S.day.kept.length + (S.cfg.maxVideos ? " of " + S.cfg.maxVideos : "") + " chosen") + "</span></div></div>";
}
function renderToday() {
  const d = new Date();
  const live = S.mode === "live";
  let h = '<div class="top"><h1>Five a Day</h1><span class="date">' + d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) + "</span></div>" + meters();
  if (!live) h += '<div class="panel"><strong>You are looking at demo videos.</strong><span class="note">Connect your YouTube account to see new uploads from your subscriptions.</span><button class="primary" data-act="goto-settings" type="button">Set up YouTube</button></div>';
  if (busy) h += '<div class="card done"><p>' + esc(busy) + "</p></div>";
  else {
    const cand = candidates(), fit = cand.filter(v => v.secs <= remainingSecs()), v = fit[0];
    const hidden = cand.length - fit.length;
    if (live && !S.day.poolAt) h += '<div class="card done"><h2>Ready when you are</h2><p>Load today\'s candidates from your subscriptions.</p><button class="primary" data-act="load" type="button">Load videos</button></div>';
    else if (countFull()) h += '<div class="card done"><h2>That\'s your ' + S.cfg.maxVideos + ".</h2><p>YouTube can wait until tomorrow. Enjoy these.</p></div>";
    else if (remainingSecs() < 60) {
      const am = new Date().getHours() < S.cfg.hour;
      h += '<div class="card done"><h2>Time\'s used up for now.</h2><p>' + (am && S.cfg.pmMin ? S.cfg.pmMin + " more minutes unlock at " + hourLabel(S.cfg.hour) + "." : "See you tomorrow.") + "</p></div>";
    } else if (!v) h += '<div class="card done"><h2>Nothing that fits.</h2><p>' + (hidden ? hidden + " videos are longer than your time left." : "You've seen every candidate for today.") + '</p>' + (live ? '<button data-act="load" type="button">Refresh list</button>' : "") + "</div>";
    else {
      h += '<article class="card">' + thumbHtml(v) + '<div class="info"><h2 class="vtitle">' + esc(v.title) + '</h2><div class="chan">' + esc(v.channel) + (v.cat ? " · " + esc(v.cat) : "") + '</div><div class="why">' + esc(why(v)) + "</div></div></article>" +
        '<div class="actions"><button class="skip" data-act="skip" data-id="' + esc(v.id) + '" type="button">Not for me</button><button class="primary" data-act="keep" data-id="' + esc(v.id) + '" type="button">Watch today</button></div>';
      if (hidden) h += '<p class="note">' + hidden + " longer video" + (hidden > 1 ? "s are" : " is") + " hidden until you have more time.</p>";
    }
  }
  h += '<section><h2 class="sec">Today\'s picks</h2><ul class="list">' + (S.day.kept.length ? S.day.kept.map(rowHtml).join("") : '<li class="empty">Nothing chosen yet.</li>') + "</ul></section>";
  const ws = Object.entries(S.w).filter(([k, n]) => n !== 0 && (k.startsWith("ch:") || k.startsWith("cat:"))).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 8);
  h += '<section><h2 class="sec">What it has learned</h2><div class="taste">' + (ws.length ? ws.map(([k, n]) => '<span class="chip ' + (n > 0 ? "up" : "down") + '">' + esc(k.slice(k.indexOf(":") + 1)) + " " + (n > 0 ? "+" : "") + Math.round(n) + "</span>").join("") : '<span class="empty" style="width:100%">Pick and skip a few videos and your preferences show up here.</span>') + "</div></section>";
  if (live && S.day.poolAt && !busy) h += '<button class="small" data-act="load" type="button" style="align-self:flex-start">Refresh candidates</button>';
  $("view").innerHTML = h;
}
function rowHtml(v) {
  return '<li class="row">' + thumbHtml(v) + '<div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + esc(v.channel) + " · " + fmt(v.secs) + '</div><div class="btns"><button class="small primary" data-act="play" data-id="' + esc(v.id) + '" type="button">Play</button><button class="small" data-act="unkeep" data-id="' + esc(v.id) + '" type="button">Remove</button></div></div></li>';
}
function renderSearch() {
  $("view").innerHTML = '<div class="top"><h1>Search</h1></div>' +
    (S.mode === "live" ? '<form class="search" id="sform"><input type="search" id="sq" placeholder="Find a specific video" autocomplete="off" value="' + esc(searchState.q) + '"><button class="primary" type="submit">Go</button></form><div id="sres"></div>'
      : '<div class="panel"><strong>Search needs a YouTube connection.</strong><span class="note">Connect your account in Settings to search real videos.</span><button class="primary" data-act="goto-settings" type="button">Set up YouTube</button></div>');
  if (S.mode === "live") renderSearchResults();
}
function renderSearchResults(msg) {
  const el = $("sres"); if (!el) return;
  if (msg) { el.innerHTML = '<p class="note">' + esc(msg) + "</p>"; return; }
  if (searchState.err) { el.innerHTML = '<div class="empty">' + esc(searchState.err) + "</div>"; return; }
  if (!searchState.res) { el.innerHTML = '<p class="note">Anything you add counts toward today\'s time and video limit like any other pick.</p>'; return; }
  if (!searchState.res.length) { el.innerHTML = '<div class="empty">No videos found.</div>'; return; }
  el.innerHTML = '<ul class="list">' + searchState.res.map(v => {
    const added = S.day.kept.some(k => k.id === v.id), ok = fits(v);
    return '<li class="row">' + thumbHtml(v) + '<div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + esc(v.channel) + " · " + fmt(v.secs) + '</div><div class="btns">' +
      (added ? '<button class="small" disabled type="button">Added</button>' : '<button class="small primary" data-act="keep" data-id="' + esc(v.id) + '" type="button"' + (ok ? "" : " disabled") + ">Add to today</button>") +
      '<button class="small" data-act="play" data-id="' + esc(v.id) + '" type="button">Preview</button></div>' + (!ok && !added ? '<div class="c" style="margin-top:6px">Too long for the time left.</div>' : "") + "</div></li>";
  }).join("") + "</ul>";
}
function renderSettings() {
  const c = S.cfg, live = S.mode === "live";
  $("view").innerHTML = '<div class="top"><h1>Settings</h1></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">YouTube connection</h2>' +
    '<p class="note" style="margin:0">' + (live ? "Connected. Your subscriptions feed the daily list." : "Not connected. Demo videos are shown.") + "</p>" +
    '<label class="f">Google client ID<input type="text" id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="123456-abc.apps.googleusercontent.com" value="' + esc(c.clientId) + '"></label>' +
    '<p class="note" style="margin:0">In Google Cloud Console, add this address as an authorized JavaScript origin:</p><code>' + esc(location.origin) + "</code>" +
    '<div class="actions" style="grid-template-columns:1fr 1fr"><button class="primary" data-act="connect" type="button">' + (live ? "Reconnect" : "Connect YouTube") + '</button><button data-act="disconnect" type="button">' + (live ? "Disconnect" : "Use demo") + "</button></div></div>" +
    '<div class="panel"><h2 class="sec" style="margin:0">Daily limits</h2><div class="grid2">' +
    '<label class="f">Videos per day (0 = no cap)<input type="number" inputmode="numeric" id="mv" min="0" max="20" value="' + c.maxVideos + '"></label>' +
    '<label class="f">Switch hour (0–23)<input type="number" inputmode="numeric" id="hr" min="0" max="23" value="' + c.hour + '"></label>' +
    '<label class="f">Minutes before the switch<input type="number" inputmode="numeric" id="am" min="0" max="600" value="' + c.amMin + '"></label>' +
    '<label class="f">Extra minutes after<input type="number" inputmode="numeric" id="pm" min="0" max="600" value="' + c.pmMin + '"></label></div>' +
    '<button class="primary" data-act="savecfg" type="button">Save limits</button></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">Today</h2><button data-act="resetday" type="button">Start today over</button><button data-act="resettaste" type="button">Forget what it learned</button></div>' +
    '<p class="note">Likes and skips shape the ranking here. YouTube does not let apps send "not interested", so your real recommendations are not affected.</p>';
}
function render() { rollDay(); ({ today: renderToday, search: renderSearch, settings: renderSettings })[tab](); document.querySelectorAll("#nav button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); }
function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const nb = e.target.closest("#nav button"); if (nb) return setTab(nb.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "keep") { const v = findVideo(id); if (v) keep(v); if (tab === "search") renderSearchResults(); }
  else if (act === "skip") { const v = findVideo(id); if (v) skip(v); }
  else if (act === "unkeep") unkeep(id);
  else if (act === "play") openPlayer(id);
  else if (act === "close") closePlayer();
  else if (act === "like") { try { await api("videos/rate", { id, rating: "like" }, { method: "POST" }); toast("Liked on YouTube."); } catch (er) { toast(er.message); } }
  else if (act === "load") loadPool();
  else if (act === "goto-settings") setTab("settings");
  else if (act === "connect") {
    S.cfg.clientId = $("cid").value.trim(); save();
    try { await signIn(true); toast("Connected."); setTab("today"); loadPool(); } catch (er) { toast(er.message); }
  } else if (act === "disconnect") { S.mode = "demo"; S.token = null; S.tokenExp = 0; save(); render(); }
  else if (act === "savecfg") {
    const n = (id, lo, hi, d) => { const x = parseInt($(id).value, 10); return isNaN(x) ? d : Math.min(hi, Math.max(lo, x)); };
    S.cfg.clientId = $("cid").value.trim(); S.cfg.maxVideos = n("mv", 0, 20, 5); S.cfg.hour = n("hr", 0, 23, 12); S.cfg.amMin = n("am", 0, 600, 15); S.cfg.pmMin = n("pm", 0, 600, 45);
    save(); toast("Saved."); render();
  } else if (act === "resetday") { S.day.kept = []; S.day.skipped = []; save(); toast("Today reset."); render(); }
  else if (act === "resettaste") { S.w = {}; save(); toast("Preferences cleared."); render(); }
});
document.addEventListener("submit", e => { if (e.target.id === "sform") { e.preventDefault(); const q = $("sq").value.trim(); if (q) runSearch(q); } });

/* ---------- home-screen icon, drawn at runtime ---------- */
try {
  const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
  x.fillStyle = "#0f0f0f"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#ffffff"; x.font = "700 118px 'Helvetica Neue', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText("5", 90, 128);
  x.fillStyle = "#ff0000"; for (let i = 0; i < 5; i++) x.fillRect(30 + i * 24, 148, 18, 6);
  $("touchIcon").href = c.toDataURL("image/png");
} catch (e) {}

render();
setInterval(() => { if (tab === "today" && !busy && $("sheet").hidden) render(); }, 60000);
if (S.mode === "live" && !S.day.poolAt && tokenValid()) loadPool();
</script>
</body>
</html>
