.toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

<script>
"use strict";
/* ---------- storage ---------- */

const fresh = () => ({
  cfg: { clientId: "", maxVideos: 5, amMin: 15, pmMin: 45, hour: 12, days: 7 }, seen: {}, skipped: [],

const $ = id => document.getElementById(id);

/* ---------- demo data ---------- */
const DEMO = [
  ["Why bridges hum in the wind", "Span Lab", 14, "Science", 200], ["I rebuilt a 1960s radio from one photo", "Bench Notes", 23, "Making", 20],
  ["The quiet collapse of the Bronze Age", "Long Ago", 41, "History", 35], ["A week of cooking only from one pot", "Salt & Steam", 18, "Cooking", 12],
  ["How a mechanical watch keeps time", "Escapement", 16, "Science", 215], ["Learning Rust by building a tiny database", "Null Pointer", 52, "Coding", 260],
  ["Cutting dovetails by hand, slowly", "Oak & Chisel", 27, "Making", 30], ["Why every city map lies a little", "Flat Earth Cartography", 12, "Geography", 170],
  ["Piano voicings that sound expensive", "Chord Garden", 21, "Music", 300], ["Eight stretches for desk shoulders", "Move Daily", 9, "Fitness", 140],
  ["What index funds actually own", "Plain Ledger", 11, "Finance", 100], ["Fixing a leaking faucet in ten minutes", "Fix It Ben", 10, "Making", 80],
  ["How sourdough starters stay alive", "Salt & Steam", 15, "Cooking", 12], ["Python tricks I wish I knew sooner", "Null Pointer", 13, "Coding", 260],
  ["Interest rates, explained with a bathtub", "Plain Ledger", 16, "Finance", 100], ["Three days in Lisbon on a budget", "Slow Roads", 25, "Travel", 55]
].map((v, i) => ({ id: "demo" + i, title: v[0], channel: v[1], cat: v[3], secs: v[2] * 60, hue: v[4], demo: true, channelId: "demo:" + v[1], at: Date.now() - (((i * 5) % 9) * 24 + (i * 7) % 20 + 1) * 3600000 }));

/* ---------- time budget ---------- */
function allowanceMin() { const h = new Date().getHours() + new Date().getMinutes() / 60; return S.cfg.amMin + (h >= S.cfg.hour ? S.cfg.pmMin : 0); }
const usedSecs = () => S.day.kept.reduce((s, v) => s + v.secs, 0);
const remainingSecs = () => Math.max(0, allowanceMin() * 60 - usedSecs());
const countFull = () => S.cfg.maxVideos > 0 && S.day.kept.length >= S.cfg.maxVideos;
const fmt = secs => { const m = Math.round(secs / 60); return m < 1 ? "<1 min" : m + " min"; };
const clock = secs => { const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const hourLabel = h => (h % 12 === 0 ? 12 : h % 12) + ":00 " + (h >= 12 ? "pm" : "am");

/* ---------- taste model ---------- */
const STOP = new Set("about after again being could every first from have into just more most only other over really should some still than that their them then there these they this those very what when where which while with would your video videos make made".split(" "));
function keysOf(v) {
  const words = (String(v.title).toLowerCase().match(/[a-z]{5,}/g) || []).filter(w => !STOP.has(w)).slice(0, 4);
  return [["ch:" + v.channel, 1.5], v.cat ? ["cat:" + v.cat, 1] : null, ...words.map(w => ["w:" + w, 0.5])].filter(Boolean);
}
const score = v => keysOf(v).reduce((s, [k, m]) => s + (S.w[k] || 0) * m, 0);
const bump = (v, d) => keysOf(v).forEach(([k]) => { S.w[k] = Math.round(((S.w[k] || 0) + d) * 10) / 10; });
const winDays = () => S.day.windowDays || S.cfg.days || 7;
const nextWin = () => [7, 14, 30].find(d => d > winDays());
const myChannels = () => S.channels.filter(c => c.id.startsWith("demo:") === (S.mode !== "live"));
function candidates() {
  const set = new Set(myChannels().map(c => c.id));
  let pool = S.mode === "live" ? S.day.pool : DEMO;
  if (S.mode === "live" || set.size) pool = pool.filter(v => !v.channelId || set.has(v.channelId));
  const oldest = Date.now() - winDays() * 864e5;
  return pool.filter(v => !S.seen[v.id] && !S.day.kept.some(k => k.id === v.id) && (!v.at || v.at >= oldest)).sort((a, b) => score(b) - score(a));
}
function why(v) {
  if ((S.w["ch:" + v.channel] || 0) > 0) return "You've picked " + v.channel + " before.";
  if (v.cat && (S.w["cat:" + v.cat] || 0) > 0) return "You keep choosing " + v.cat.toLowerCase() + ".";
  return "New from channels you follow.";
}

/* ---------- YouTube API ---------- */
let tokenClient = null, tokenWait = null;
function tokenValid() { return S.token && Date.now() < S.tokenExp - 30000; }
function signIn(interactive) {
  return new Promise((resolve, reject) => {
    if (!S.cfg.clientId) return reject(new Error("Add your Google client ID in Settings first."));
    if (!(window.google && google.accounts && google.accounts.oauth2)) return reject(new Error("Google sign-in is still loading. Try again in a moment."));
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.cfg.clientId, scope: "https://www.googleapis.com/auth/youtube",
      callback: r => {
        if (r.error) return reject(new Error("Sign-in failed: " + (r.error_description || r.error)));
        S.token = r.access_token; S.tokenExp = Date.now() + (r.expires_in || 3600) * 1000; S.mode = "live"; save(); resolve();

}
async function api(path, params, opts) {

  const url = "https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams(params).toString();
  const r = await fetch(url, { method: opts.method || "GET", headers: { Authorization: "Bearer " + S.token } });
  if (r.status === 204) return {};
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((j.error && j.error.message) || ("YouTube error " + r.status)); e.status = r.status; e.reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason; throw e; }

}
function isoSecs(d) { const m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(d || ""); if (!m) return 0; return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0); }
async function hydrate(ids) {
  const out = [];

    const j = await api("videos", { part: "snippet,contentDetails", id: ids.slice(i, i + 50).join(","), maxResults: 50 });
    (j.items || []).forEach(it => out.push({
      id: it.id, title: it.snippet.title, channel: it.snippet.channelTitle, channelId: it.snippet.channelId, at: Date.parse(it.snippet.publishedAt) || 0, cat: CATS[it.snippet.categoryId] || "",
      secs: isoSecs(it.contentDetails.duration), live: it.snippet.liveBroadcastContent !== "none"
    }));

}
const CATS = { 1: "Film", 2: "Autos", 10: "Music", 15: "Pets", 17: "Sports", 19: "Travel", 20: "Gaming", 22: "People", 23: "Comedy", 24: "Entertainment", 25: "News", 26: "How-to", 27: "Education", 28: "Science & tech", 29: "Nonprofit" };
async function dropShorts(vids) {
  const sus = vids.filter(v => v.secs <= 180);
  if (!sus.length) return vids;
  const shorts = new Set();
  await Promise.all([...new Set(sus.map(v => v.channelId))].filter(Boolean).map(async ch => {
    try {
      const j = await api("playlistItems", { part: "contentDetails", playlistId: "UUSH" + ch.slice(2), maxResults: 50 });
      (j.items || []).forEach(i => shorts.add(i.contentDetails.videoId));
    } catch (e) {}
  }));

}
async function uploadsOf(ch) {
  try { return await api("playlistItems", { part: "contentDetails", playlistId: "UULF" + ch.slice(2), maxResults: 25 }); }
  catch (e) { if (e.status === 404) return api("playlistItems", { part: "contentDetails", playlistId: "UU" + ch.slice(2), maxResults: 25 }); throw e; }

async function loadPool() {
  const picked = myChannels().map(c => c.id);

  busy = "Finding new uploads…"; render();

    const ids = new Set(), cutoff = Date.now() - winDays() * 864e5;

        try {
          const j = await uploadsOf(ch);
          (j.items || []).forEach(it => { if (new Date(it.contentDetails.videoPublishedAt || 0).getTime() > cutoff) ids.add(it.contentDetails.videoId); });

    const vids = await dropShorts((await hydrate([...ids])).filter(v => !v.live && v.secs > 60));
    S.day.pool = vids; S.day.poolAt = Date.now(); S.chChanged = false; busy = ""; save(); render();

}
const SWIN = [0, 7, 30, 365, Infinity];
const SLABEL = ["Last 7 days", "7 to 30 days ago", "30 days to 1 year ago", "More than a year ago"];
const SNEXT = ["", "up to 30 days", "up to 1 year", "any time"];
async function runSearch(q) { searchState = { q, groups: [], err: "", loading: true }; await searchGroup(q, 0); }
async function searchGroup(q, idx) {

    const p = { part: "snippet", q, type: "video", maxResults: 12, safeSearch: "none" };
    if (SWIN[idx + 1] !== Infinity) p.publishedAfter = new Date(Date.now() - SWIN[idx + 1] * 864e5).toISOString();
    if (SWIN[idx] > 0) p.publishedBefore = new Date(Date.now() - SWIN[idx] * 864e5).toISOString();
    const j = await api("search", p);
    const ids = (j.items || []).map(i => i.id.videoId).filter(Boolean);
    const have = new Set(searchState.groups.flatMap(g => g.vids.map(v => v.id)));
    let vids = ids.length ? (await hydrate(ids)).filter(v => !v.live && v.secs > 60 && !have.has(v.id)) : [];
    vids = await dropShorts(vids);

    searchState.groups.push({ idx, vids });

/* ---------- actions ---------- */

    '<label class="f" style="grid-column:1/-1">Show uploads from the last (days)<input type="number" inputmode="numeric" id="dy" min="1" max="30" value="' + c.days + '"></label></div>' +
    '<button class="primary" data-act="savecfg" type="button">Save limits</button></div>' +
    '<div class="panel"><h2 class="sec" style="margin:0">Today</h2><button data-act="resetday" type="button">Start today over</button><button data-act="resettaste" type="button">Forget what it learned</button></div>' +
    '<p class="note">Likes and skips shape the ranking here. YouTube does not let apps send "not interested", so your real recommendations are not affected.</p>';
}
function render() { rollDay(); ({ today: renderToday, search: renderSearch, settings: renderSettings, channels: renderChannels })[tab](); document.querySelectorAll("#nav button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); }
function setTab(t) { tab = t; render(); window.scrollTo(0, 0); if (t === "channels") ensureSubs(); }

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const nb = e.target.closest("#nav button"); if (nb) return setTab(nb.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "keep") { const v = findVideo(id); if (v) keep(v); if (tab === "search") renderSearchResults(); }
  else if (act === "skip") { const v = findVideo(id); if (v) skip(v); }
  else if (act === "unkeep") unkeep(id);
  else if (act === "play") openPlayer(id);
  else if (act === "close") closePlayer();
  else if (act === "like") { try { await api("videos/rate", { id, rating: "like" }, { method: "POST" }); toast("Liked on YouTube."); } catch (er) { toast(er.message); } }
  else if (act === "load") loadPool();
  else if (act === "goto-settings") setTab("settings");
  else if (act === "goto-channels") setTab("channels");
  else if (act === "older") { S.day.windowDays = nextWin(); save(); if (S.mode === "live") loadPool(); else render(); }
  else if (act === "unskip") unskip(id);
  else if (act === "toggleskipped") { showSkipped = !showSkipped; render(); }
  else if (act === "searchmore") searchGroup(searchState.q, searchState.groups.length);
  else if (act === "toastact") { const f = toastFn; toastFn = null; $("toast").hidden = true; if (f) f(); }
  else if (act === "addch") addChannel(id);
  else if (act === "rmch") removeChannel(id);
  else if (act === "browse") { showSubs = !showSubs; b.textContent = showSubs ? "Hide my subscriptions" : "Browse my YouTube subscriptions"; updateSugg(); }
  else if (act === "reauth") { try { await signIn(false); await ensureSubs(); const q = chQuery.trim(); if (q.length >= 3) remoteSearch(q); else updateSugg(); } catch (er) { toast(er.message); } }
  else if (act === "connect") {
    S.cfg.clientId = $("cid").value.trim(); save();
    try { await signIn(true); toast("Connected."); setTab("today"); loadPool(); } catch (er) { toast(er.message); }
  } else if (act === "disconnect") { S.mode = "demo"; S.token = null; S.tokenExp = 0; save(); render(); }
  else if (act === "savecfg") {
    const n = (id, lo, hi, d) => { const x = parseInt($(id).value, 10); return isNaN(x) ? d : Math.min(hi, Math.max(lo, x)); };
    S.cfg.clientId = $("cid").value.trim(); S.cfg.maxVideos = n("mv", 0, 20, 5); S.cfg.hour = n("hr", 0, 23, 12); S.cfg.amMin = n("am", 0, 600, 15); S.cfg.pmMin = n("pm", 0, 600, 45); S.cfg.days = n("dy", 1, 30, 7); S.day.windowDays = 0;
    save(); toast("Saved."); render();
  } else if (act === "resetday") { S.day.kept.forEach(v => { delete S.seen[v.id]; }); S.day.kept = []; save(); toast("Today reset."); render(); }
  else if (act === "resettaste") { S.w = {}; save(); toast("Preferences cleared."); render(); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "cq") return;
  chQuery = e.target.value; clearTimeout(remoteTimer); updateSugg();
  const q = chQuery.trim();
  if (S.mode === "live" && q.length >= 3 && tokenValid()) remoteTimer = setTimeout(() => remoteSearch(q), 700);
});
document.addEventListener("submit", e => { if (e.target.id === "sform") { e.preventDefault(); const q = $("sq").value.trim(); if (q) runSearch(q); } });

/* ---------- home-screen icon, drawn at runtime ---------- */
try {
  const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
  x.fillStyle = "#0f0f0f"; x.fillRect(0, 0, 180, 180);
  x.fillStyle = "#ffffff"; x.font = "700 118px 'Helvetica Neue', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText("5", 90, 128);
  x.fillStyle = "#ff0000"; for (let i = 0; i < 5; i++) x.fillRect(30 + i * 24, 148, 18, 6);
  $("touchIcon").href = c.toDataURL("image/png");
} catch (e) {}

render();
setInterval(() => { if (tab === "today" && !busy && $("sheet").hidden) render(); }, 60000);
if (S.mode === "live" && !S.day.poolAt && tokenValid() && myChannels().length) loadPool();
</script>
</body>
</html>
